<!DOCTYPE html>
<html>
<head>
<title>aiplaylist</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>

<style>

:root{
  --bg:#020617;
  --panel:#0f172a;
  --panel2:#020617;
  --accent:#3b82f6;
  --accent2:#60a5fa;
  --text:#e5e7eb;
  --muted:#64748b;
}

*{box-sizing:border-box;}

body{
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:linear-gradient(180deg,#020617,#0f172a);
  color:var(--text);
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding:40px 20px;
}

.app{
  width:100%;
  max-width:720px;
}

/* ---------- HEADER ---------- */

header{
  text-align:center;
  margin-bottom:30px;
}

.logo{
  font-size:2.2rem;
  font-weight:700;
  letter-spacing:.5px;
}

.logo span{
  color:var(--accent2);
}

.subtitle{
  color:var(--muted);
  font-size:.9rem;
  margin-top:4px;
}

/* ---------- CARD ---------- */

.card{
  background:rgba(15,23,42,.75);
  backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.05);
  border-radius:16px;
  padding:20px;
  margin-bottom:20px;
}

/* ---------- CONTROLS ---------- */

.controls{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

input,select{
  flex:1;
  padding:12px;
  border-radius:10px;
  border:none;
  background:#020617;
  color:white;
  font-size:15px;
}

input::placeholder{
  color:#94a3b8;
}

button{
  padding:12px 18px;
  border-radius:10px;
  border:none;
  font-size:15px;
  background:linear-gradient(135deg,var(--accent),#2563eb);
  color:white;
  cursor:pointer;
  transition:.15s;
}

button:hover{
  transform:translateY(-1px);
}

button:disabled{
  background:#1e293b;
  cursor:not-allowed;
}

/* ---------- PLAYER ---------- */

.player{
  margin-top:15px;
}

audio{
  width:100%;
  margin-top:10px;
}

/* ---------- PLAYLIST ---------- */

ul{
  list-style:none;
  padding:0;
  margin:0;
}

li{  
  padding:14px;
  border-radius:12px;
  background:var(--panel2);
  margin-bottom:8px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  cursor:pointer;
  transition:.15s;
}

li:hover{
  background:#0b1220;
}

li.active{
  border:1px solid var(--accent);
  background:#050b17;
  transform:scale(1.02);
}

li:focus {
  outline: 2px solid var(--accent2);
  background-color: #0b1220;
}

.track-title{
  font-size:.95rem;
}

.now-playing{
  font-size:.75rem;
  color:var(--accent2);
}

/* ---------- SPINNER ---------- */

.spinner{
  width:42px;
  height:42px;
  border-radius:50%;
  border:4px solid #1e293b;
  border-top:4px solid var(--accent);
  animation:spin 1s linear infinite;
  margin:25px auto;
  display:none;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

/* ---------- FOOTER ---------- */

footer{
  text-align:center;
  margin-top:20px;
  font-size:12px;
  color:var(--muted);
}

</style>
</head>

<body>

<div class="app" role="main" aria-label="AI Playlist music player">

<header>
<div class="logo" aria-label="Application title">ai<span>play</span>list</div>
<div class="subtitle" aria-live="polite" aria-atomic="true">AI-generated music playlists</div>
</header>

<div class="card" role="region" aria-labelledby="controlsLabel">

<div class="controls" id="controlsLabel">

<input id="prompt" placeholder="Describe music..." aria-label="Music description input"/>

<select id="llm" aria-label="Select AI language model">
<option value="openai">OpenAI</option>
<option value="local">Local LLM</option>
</select>

<select id="source" aria-label="Select music source">
<option value="youtube">YouTube</option>
<option value="local">Local MP3s</option>
</select>

<button id="btn" aria-label="Generate playlist based on description">Generate</button>

</div>

<div id="spinner" class="spinner" role="status" aria-live="polite" aria-label="Loading, please wait" aria-hidden="true"></div>

<div class="player" role="region" aria-label="Audio player">
<audio id="audioPlayer" controls style="display:none;" aria-live="polite" aria-atomic="true"></audio>
</div>

</div>
<div class="card" role="region" aria-label="Playlist tracks">
<ul id="playlist" tabindex="0" aria-label="Generated playlist"></ul>
</div>

<footer>
local-first AI music discovery
</footer>

</div>

<script>

const audioPlayer = document.getElementById("audioPlayer")
const btn = document.getElementById("btn")
const spinner = document.getElementById("spinner")
const playlistEl = document.getElementById("playlist")
const llmSelect = document.getElementById("llm")
const sourceSelect = document.getElementById("source")
const promptInput = document.getElementById("prompt")

let tracks = []
let currentIndex = 0
let repeatPlaylist = false // New flag for repeat mode

btn.onclick = generate

promptInput.addEventListener("keydown", e => {
  if (e.key === "Enter") generate()
})

// Add a toggle button for Repeat feature
const repeatBtn = document.createElement("button")
repeatBtn.textContent = "Repeat: Off"
repeatBtn.setAttribute("aria-pressed", "false")
repeatBtn.setAttribute("aria-label", "Toggle repeat playlist")
repeatBtn.style.marginLeft = "auto"
repeatBtn.style.background = "linear-gradient(135deg,#64748b,#475569)"
repeatBtn.style.color = "#e5e7eb"
repeatBtn.style.borderRadius = "10px"
repeatBtn.style.padding = "12px 18px"
repeatBtn.style.fontSize = "15px"
repeatBtn.style.cursor = "pointer"
repeatBtn.addEventListener("click", () => {
  repeatPlaylist = !repeatPlaylist
  repeatBtn.textContent = `Repeat: ${repeatPlaylist ? "On" : "Off"}`
  repeatBtn.setAttribute("aria-pressed", repeatPlaylist.toString())
})
document.querySelector(".controls").appendChild(repeatBtn)

async function generate() {

  const prompt = promptInput.value.trim()
  if (!prompt) return

  btn.disabled = true
  spinner.style.display = "block"
  spinner.setAttribute("aria-hidden", "false")
  playlistEl.innerHTML = ""
  audioPlayer.style.display = "none"

  try {

    const res = await fetch("/playlist", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        prompt,
        mode: llmSelect.value,
        source: sourceSelect.value
      })
    })

    const data = await res.json()

    tracks = data.tracks || []
    currentIndex = 0

    renderPlaylist()

  } catch (err) {

    console.error(err)
    alert("Playlist generation failed")

  }

  spinner.style.display = "none"
  spinner.setAttribute("aria-hidden", "true")
  btn.disabled = false

}

function renderPlaylist() {

  playlistEl.innerHTML = ""

  tracks.forEach((track, index) => {

    const li = document.createElement("li")

    if (index === currentIndex) li.classList.add("active")

    li.setAttribute("tabindex", "0")
    li.setAttribute("role", "button")
    li.setAttribute("aria-label", `Play track titled ${track.title}`)
    li.setAttribute("aria-pressed", index === currentIndex ? "true" : "false")

    const title = document.createElement("div")
    title.className = "track-title"
    title.textContent = track.title

    const status = document.createElement("div")
    status.className = "now-playing"
    status.textContent = index === currentIndex ? "Playing" : ""

    li.appendChild(title)
    li.appendChild(status)

    li.onclick = () => playTrack(index)

    li.addEventListener("keydown", (e) => {
      switch (e.key) {
        case "ArrowDown":
          e.preventDefault()
          if (index + 1 < tracks.length) {
            playlistEl.children[index + 1].focus()
          }
          break
        case "ArrowUp":
          e.preventDefault()
          if (index - 1 >= 0) {
            playlistEl.children[index - 1].focus()
          }
          break
        case "Enter":
        case " ":
          e.preventDefault()
          playTrack(index)
          break
      }
    })

    playlistEl.appendChild(li)

  })

  if (tracks.length > 0) playTrack(0)

}

function playTrack(index) {

  currentIndex = index

  const items = document.querySelectorAll("#playlist li")

  items.forEach((li, i) => {

    li.classList.toggle("active", i === index)
    li.setAttribute("aria-pressed", i === index ? "true" : "false")

    const status = li.querySelector(".now-playing")

    if (status) {
      status.textContent = i === index ? "Playing" : ""
    }

  })

  const activeItem = items[index]

  /* smooth scroll to track */
  activeItem.scrollIntoView({
    behavior: "smooth",
    block: "center"
  })

  const track = tracks[index]

  audioPlayer.style.display = "block"
  audioPlayer.src = track.url
  audioPlayer.load()
  audioPlayer.play()

  // Announce currently playing track for screen readers
  audioPlayer.setAttribute("aria-label", `Playing track: ${track.title}`)

}

audioPlayer.addEventListener("ended", () => {
  if (currentIndex + 1 < tracks.length) {
    playTrack(currentIndex + 1)
  } else if (repeatPlaylist && tracks.length > 0) {
    playTrack(0)
  }
})

</script>

</body>
</html>
